name: apply-admin-lock-patch
on:
  push:
    branches: [fix/security-hardening-3]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html lock/priority controls to admin-only
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('index.html')
          t = p.read_text()
          old = "if(myProfile && (myProfile.role === 'admin' || myProfile.role === 'director')){ renderLockToggleButton(); renderPriorityToggleButton(); }"
          new = "if(myProfile && myProfile.role === 'admin'){ renderLockToggleButton(); renderPriorityToggleButton(); }"
          if old not in t:
              raise SystemExit('renderLockBanner pattern not found')
          t = t.replace(old, new, 1)
          t = t.replace(
              '<p class="admin-section-label">Booking controls</p>\n  <div class="admin-card">',
              '<p class="admin-section-label" id="bookingControlsLabel">Booking controls</p>\n  <div class="admin-card" id="scheduleLockCard">',
              1,
          )
          t = t.replace(
              '<div class="admin-card" style="margin-top:16px">\n    <h3>Priority booking (grade hierarchy)</h3>',
              '<div class="admin-card" style="margin-top:16px" id="priorityBookingCard">\n    <h3>Priority booking (grade hierarchy)</h3>',
              1,
          )
          old2 = "  loadUserList();\n  renderLockToggleButton();\n  renderPriorityToggleButton();\n  renderClearControls();"
          new2 = """  loadUserList();\n  const isAdminSettings = myProfile.role === 'admin';\n  const bookingControlsLabel = document.getElementById('bookingControlsLabel');\n  const scheduleLockCard = document.getElementById('scheduleLockCard');\n  const priorityBookingCard = document.getElementById('priorityBookingCard');\n  if(bookingControlsLabel) bookingControlsLabel.style.display = isAdminSettings ? '' : 'none';\n  if(scheduleLockCard) scheduleLockCard.style.display = isAdminSettings ? '' : 'none';\n  if(priorityBookingCard) priorityBookingCard.style.display = isAdminSettings ? '' : 'none';\n  if(isAdminSettings){\n    renderLockToggleButton();\n    renderPriorityToggleButton();\n  }\n  renderClearControls();"""
          if old2 not in t:
              raise SystemExit('admin settings render pattern not found')
          t = t.replace(old2, new2, 1)
          p.write_text(t)
          print('patched index.html')
          PY
      - name: Commit patch and remove this workflow
        run: |
          rm -f .github/workflows/apply-admin-lock-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git add -A .github/workflows/apply-admin-lock-patch.yml || true
          git diff --cached --quiet && echo 'nothing to commit' && exit 0
          git commit -m "Restrict schedule lock and priority controls to admin"
          git push
